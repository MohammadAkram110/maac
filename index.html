<body>

  <div class="shell">
    <aside class="side" id="sidebar">

        <span><strong>My Shift &amp; Life</strong><small>DIGITAL DIARY</small></span>
      </a>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="side-footer"><span class="state-dot"></span><span>Saved on this device</span></div>
    </aside>
    <div class="workspace">
      <div class="diary-top">
      <header class="toolbar">
        <button id="menu" class="icon-button mobile-menu" type="button" data-action="menu" aria-controls="sidebar" aria-expanded="false" aria-label="Menu"></button>
        <span class="context"><span class="context-dot"></span> CAN Plant <span class="toolbar-divider"></span> Asia/Karachi</span>
        <div class="toolbar-actions">
          <button class="tool-button" type="button" data-action="task-focus" id="focus-toggle" aria-label="Focus" aria-pressed="false" title="Focus" disabled><span>Focus</span></button>
          <button class="tool-button" type="button" data-action="companion-pause" id="pause-toggle" disabled><span>Pause &amp; capture</span></button>
          <button class="icon-button" type="button" data-action="navigate" data-view="search" id="search-button" aria-label="Search diary" title="Search diary"></button>
          <button class="icon-button reminder-button" type="button" data-action="reminders" id="reminder-button" aria-label="Reminders"></button>
          <details class="toolbar-more">
            <summary>Tools</summary>
            <div class="toolbar-menu">
              <button class="tool-button" type="button" data-action="task-focus">Focus</button>
              <button class="tool-button" type="button" data-action="companion-pause">Pause &amp; capture</button>
              <button class="tool-button" type="button" data-action="meal-log">Meal log</button>
              <button class="tool-button sticky-toggle" type="button" data-action="sticky-dock" id="sticky-toggle" aria-label="Show pinned stickies" aria-controls="sticky-dock" aria-expanded="false" disabled><span>Pinned stickies</span><span id="sticky-count" class="sticky-count" hidden></span></button>
              <button class="tool-button sticky-toggle" type="button" data-action="task-dock" id="task-toggle" aria-label="Pin Tasks panel" aria-controls="task-dock" aria-expanded="false" disabled><span>Pinned tasks</span></button>
              <button class="tool-button" type="button" data-action="add" id="quick-add">Add diary entry</button>
            </div>
          </details>
        </div>
      </header>
      <section id="shift-alarms" class="shift-alarms" aria-labelledby="shift-alarms-title" hidden></section>
      </div>
      <main id="main" tabindex="-1">
        <p class="empty">Opening your diary…</p>
        <p class="muted">If this message stays on screen, reload this page in your browser.</p>
      </main>
      <aside class="page-dock" id="page-dock" aria-label="Pinned work" hidden>
      <section class="sticky-dock" id="sticky-dock" aria-labelledby="sticky-dock-title" hidden>
        <header class="sticky-dock-head">
          <div class="panel-head">
            <div><span class="eyebrow">Across diary pages</span><h2 id="sticky-dock-title">Pinned stickies</h2></div>
            <button class="icon-button" type="button" data-action="sticky-dock" data-hide="yes" id="sticky-dock-close" aria-label="Hide sticky panel" title="Hide sticky panel"></button>
          </div>
          <div class="actions">
            <button class="primary small" type="button" data-action="sticky-new" data-pinned="yes" id="sticky-dock-add">Add pinned sticky</button>
            <button class="text-button small" type="button" data-action="navigate" data-view="stickies">Open board</button>
          </div>
        </header>
        <div class="sticky-dock-list" id="sticky-dock-list"></div>
      </section>
      <section class="sticky-dock" id="task-dock" aria-labelledby="task-dock-title" hidden>
        <header class="sticky-dock-head">
          <div class="panel-head">
            <div><span class="eyebrow">Across diary pages</span><h2 id="task-dock-title">Pinned Tasks panel</h2></div>
            <button class="icon-button" type="button" data-action="task-dock" data-hide="yes" id="task-dock-close" aria-label="Hide Tasks panel" title="Hide Tasks panel"></button>
          </div>
          <div class="actions">
            <button class="primary small" type="button" data-action="add" data-type="task" id="task-dock-add">New task</button>
            <button class="text-button small" type="button" data-action="navigate" data-view="tasks">Open Tasks</button>
          </div>
        </header>
        <div class="sticky-dock-list" id="task-dock-list"></div>
      </section>
      </aside>
    </div>
  </div>
  <nav id="mobile-navigation" class="mobile-nav" aria-label="Quick navigation"></nav>
  <button id="nav-overlay" type="button" data-action="menu" aria-label="Close menu" hidden></button>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="confirm" aria-labelledby="confirm-title"></dialog>
  <section id="meal-popup" class="meal-popup" aria-label="Meal reminder" hidden></section>
  <section id="work-update-popup" class="work-update-popup" aria-labelledby="work-update-title" hidden></section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="print-area"></div>
  <noscript><p>Turn on JavaScript to open this diary.</p></noscript>
